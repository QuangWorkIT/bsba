services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bsba_be/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      bsba_network:

volumes:
  postgres_data:
    driver: local


networks:
    bsba_network:
        driver: bridge