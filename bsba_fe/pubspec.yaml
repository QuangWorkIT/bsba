name: project
description: "Board game space booking application by Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.2.0
  url_launcher: ^6.2.6
  stomp_dart_client: ^2.1.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/map/